# Portra's Chromium engine is whatever Electron ships, and it only moves when this repo moves.
# Nobody remembers to check, so Dependabot checks instead and opens the PR. CI on pull requests
# runs `npm run check` and the build, so a bump that breaks something is caught before merge.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Electron stays on its own. A bump here is a Chromium security update for every user,
      # and majors carry real breaking-change risk, so it should never arrive bundled with
      # unrelated noise.
      electron:
        patterns:
          - electron
      # Packaging and publishing move together; splitting them produces PRs that fail on
      # their own and pass in pairs.
      build-tooling:
        patterns:
          - electron-builder
          - electron-updater
          - "@electron/*"
      # Everything else that only affects the dev loop can arrive as one PR.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - electron
          - electron-builder
          - "@electron/*"

  # The workflow pins actions by major tag; this catches deprecations like the Node 20
  # runner warning CI is already emitting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
